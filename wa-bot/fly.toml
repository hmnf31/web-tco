app = "tco-wa-bot"

primary_region = "sin"

[build]
  dockerfile = "wa-bot/Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "wa_session"
  destination = "/data"

[env]
  PORT = "3001"
  TCO_WEBSITE_URL = "https://web-tco.vercel.app"
